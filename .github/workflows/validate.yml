name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and browser test dependencies
        run: python -m pip install -r requirements-browser.txt skills-ref
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Validate Agent Skills metadata
        run: agentskills validate ./search-patents-cross-border
      - name: Run offline tests
        env:
          PATENT_TEST_BROWSER: chromium
        run: python -m unittest discover -s tests -p 'test*.py' -v
